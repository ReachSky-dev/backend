spring:
  application:
    name: reachsky
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/reachsky}
    username: ${DB_USERNAME:reachsky}
    password: ${DB_PASSWORD:reachsky}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          # Domyślna wartość tylko dla pracy lokalnej (profil dev).
          # Profil prod nadpisuje bez domyślnej — brak OIDC_ISSUER_URI = fail przy starcie.
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8081/realms/reachsky}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never

server:
  error:
    include-message: never
    include-stacktrace: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: false

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:3000}
  api-url: ${APP_API_URL:http://localhost:8080}
