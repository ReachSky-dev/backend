spring:
  application:
    name: reachsky
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/reachsky}
    username: ${DB_USERNAME:reachsky}
    password: ${DB_PASSWORD:reachsky}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never

server:
  error:
    include-message: never
    include-stacktrace: never

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:3000}
  api-url: ${APP_API_URL:http://localhost:8080}
