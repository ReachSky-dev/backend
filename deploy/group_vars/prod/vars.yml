# Konfiguracja środowiska prod — wartości jawne (nie tajne).
# Wartości tajne: group_vars/prod/vault.yml (zaszyfrowane ansible-vault).

# ── Tożsamość środowiska ──────────────────────────────────────────────────────
env_name: prod

# ── Połączenie SSH ────────────────────────────────────────────────────────────
# ansible_host pochodzi z vault — adres IP serwera nie trafia do repo w plaintext.
ansible_host:                 "{{ vault_ansible_host }}"
ansible_user:                 reachsky
ansible_ssh_private_key_file: ~/.ssh/id_reachsky

# ── Adresy publiczne ──────────────────────────────────────────────────────────
url_frontend: "https://reachsky.pl"
url_api:      "https://api.reachsky.pl"
url_auth:     "https://auth.reachsky.pl"

# ── Weryfikacja po deploy ─────────────────────────────────────────────────────
# Zmień na true po skonfigurowaniu tunelu Cloudflare.
verify_public:     false
public_health_url: "{{ url_api }}/actuator/health"

# ── Limity pamięci kontenerów ─────────────────────────────────────────────────
# Razem: ~1050 MB. Serwer 8 GB — prod + demo (~1700 MB) + observability (~700 MB) = ~2400 MB.
mem_postgres:    "512m"
mem_keycloak:    "768m"
mem_backend:     "512m"
mem_frontend:    "128m"
mem_cloudflared: "64m"

# ── JVM ───────────────────────────────────────────────────────────────────────
# 75% z 512 MB limitu kontenera = ~384 MB heap.
# Margines na metaspace, GC overhead, JVM internals: ~128 MB.
jvm_max_ram_pct: 75.0

# ── Sekrety (referencje do vault.yml) ────────────────────────────────────────
db_password:             "{{ vault_db_password }}"
kc_admin_password:       "{{ vault_kc_admin_password }}"
cloudflare_tunnel_token: "{{ vault_cloudflare_tunnel_token }}"
