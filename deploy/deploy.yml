---
# deploy.yml — wdrożenie nowej wersji obrazów.
#
# Użycie:
#   ansible-playbook deploy.yml -e "backend_tag=<sha> frontend_tag=<sha>"
#
# backend_tag i frontend_tag są WYMAGANE — playbook failuje natychmiast bez nich.
# Nie używaj "latest" w produkcji — zawsze SHA commita (40 znaków).
#
# Przepływ:
#   1. Sprawdź wymagane zmienne
#   2. Odczytaj poprzednie tagi z .deployed_tags (potrzebne do auto-rollbacku)
#   3. Zapisz .env z sekretami i nowymi tagami (tryb 0600)
#   4. docker compose pull + up -d
#   5. Czekaj na "healthy" backendu (max health_retries * health_delay_seconds)
#   6. [Opcjonalnie] Weryfikacja przez publiczny URL API (verify_public: true)
#   7a. Sukces: zaktualizuj .deployed_tags
#   7b. Błąd: auto-rollback do poprzednich tagów, zakończ błędem

- name: ReachSky — wdrożenie
  hosts: prod
  become: true
  gather_facts: false

  tasks:

    # ── 1. Walidacja ────────────────────────────────────────────────────────
    # BUG FIX: poprzednia wersja miała play-level vars z samoreferencją
    # (backend_tag: "{{ backend_tag | default('latest') }}"), co jest fragile.
    # Teraz: fail-fast jeśli tagi nie są podane — lepsza diagnostyka.
    - name: Wymagane zmienne — sprawdź przed deploy
      ansible.builtin.fail:
        msg: >
          backend_tag i frontend_tag są wymagane.
          Użycie: ansible-playbook deploy.yml -e "backend_tag=<sha> frontend_tag=<sha>"
      when: backend_tag is not defined or frontend_tag is not defined

    # ── 2. Poprzednie tagi ─────────────────────────────────────────────────
    - name: Odczytaj .deployed_tags
      ansible.builtin.slurp:
        src: "{{ deploy_dir }}/.deployed_tags"
      register: _deployed_raw
      failed_when: false

    - name: Parsuj poprzednie tagi
      ansible.builtin.set_fact:
        _prev: >-
          {{
            (_deployed_raw.content | b64decode | from_json).current
            if (_deployed_raw is not failed and _deployed_raw.content is defined)
            else {"backend_tag": "none", "frontend_tag": "none"}
          }}

    - name: Pokaż co wdrażamy
      ansible.builtin.debug:
        msg:
          - "Nowe:      backend={{ backend_tag }}, frontend={{ frontend_tag }}"
          - "Poprzedni: backend={{ _prev.backend_tag }}, frontend={{ _prev.frontend_tag }}"

    # ── 3. .env ────────────────────────────────────────────────────────────
    - name: Zapisz .env (tryb 0600 — tylko właściciel)
      ansible.builtin.template:
        src: templates/env.j2
        dest: "{{ deploy_dir }}/.env"
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: "0600"

    # ── 4. Pull + up ────────────────────────────────────────────────────────
    - name: docker compose pull
      ansible.builtin.command:
        cmd: >
          docker compose
          --env-file {{ deploy_dir }}/.env
          -f {{ deploy_dir }}/docker-compose.prod.yml
          pull
      changed_when: true

    - name: docker compose up -d
      ansible.builtin.command:
        cmd: >
          docker compose
          --env-file {{ deploy_dir }}/.env
          -f {{ deploy_dir }}/docker-compose.prod.yml
          up -d
      changed_when: true

    # ── 5. Health check + opcjonalna weryfikacja przez tunel ────────────────
    - name: Sprawdź zdrowie backendu
      block:

        - name: Czekaj na backend healthy (docker inspect)
          ansible.builtin.command:
            # {% raw %}{{.State.Health.Status}}{% endraw %} — format Go template, nie Jinja2.
            cmd: >
              docker inspect
              {% raw %}--format={{.State.Health.Status}}{% endraw %}
              {{ compose_project }}-backend-1
          register: _health
          retries: "{{ health_retries }}"
          delay:   "{{ health_delay_seconds }}"
          until:   _health.stdout == "healthy"
          changed_when: false
          # BUG FIX: usunięto błędny failed_when — pętla until+retries obsługuje
          # to samodzielnie i nie potrzebuje dodatkowego warunku.

        # Opcjonalny krok: weryfikacja przez publiczny URL tunelu Cloudflare.
        # Włącz przez: -e "verify_public=true" lub verify_public: true w vars.yml.
        # Wyłączony domyślnie — przy pierwszym deploy tunel może jeszcze nie działać.
        # Niepowodzenie tego kroku uruchamia rollback (jesteśmy w bloku block:).
        - name: Weryfikacja przez tunel — GET /actuator/health
          ansible.builtin.uri:
            url: "{{ public_health_url }}"
            method: GET
            status_code: 200
            timeout: 10
            return_content: true
          register: _public_check
          retries: 6
          delay: 10
          until: >
            _public_check.status | default(0) == 200 and
            (_public_check.json.status | default('DOWN')) == 'UP'
          when: verify_public | default(false) | bool

        - name: Zaktualizuj .deployed_tags po udanym deploy
          ansible.builtin.copy:
            content: >-
              {{
                {
                  "current":  {"backend_tag": backend_tag,       "frontend_tag": frontend_tag},
                  "previous": {"backend_tag": _prev.backend_tag, "frontend_tag": _prev.frontend_tag}
                } | to_nice_json
              }}
            dest: "{{ deploy_dir }}/.deployed_tags"
            owner: "{{ app_user }}"
            group: "{{ app_group }}"
            mode: "0640"

        - name: Deploy zakończony sukcesem
          ansible.builtin.debug:
            msg: "OK — backend={{ backend_tag }}, frontend={{ frontend_tag }}"

      rescue:
        # ── Auto-rollback ─────────────────────────────────────────────────
        - name: Pobierz logi backendu przed rollbackiem
          ansible.builtin.command:
            cmd: docker logs {{ compose_project }}-backend-1 --tail 80
          changed_when: false
          failed_when: false
          register: _backend_logs

        - name: Wyświetl logi backendu
          ansible.builtin.debug:
            msg: "{{ _backend_logs.stdout_lines | default(['(brak logów)']) }}"

        # BUG FIX: poprzednia wersja próbowała `docker compose up` z tag="none"
        # przy pierwszym deploy — obraz "backend:none" nie istnieje na Docker Hub.
        - name: "ROLLBACK — abort, brak poprzedniej wersji (pierwszy deploy)"
          ansible.builtin.fail:
            msg: >
              Deploy nieudany i nie ma poprzedniej wersji do przywrócenia
              (to był pierwszy deploy). Sprawdź logi powyżej i uruchom ręcznie:
              docker logs {{ compose_project }}-backend-1 --tail 200
          when: _prev.backend_tag == "none"

        - name: "ROLLBACK — przywracam poprzednią wersję"
          ansible.builtin.debug:
            msg:
              - "Health check nieudany."
              - "Wracam do: backend={{ _prev.backend_tag }}, frontend={{ _prev.frontend_tag }}"

        - name: Rollback — przywróć .env z poprzednimi tagami
          ansible.builtin.template:
            src: templates/env.j2
            dest: "{{ deploy_dir }}/.env"
            owner: "{{ app_user }}"
            group: "{{ app_group }}"
            mode: "0600"
          vars:
            backend_tag:  "{{ _prev.backend_tag }}"
            frontend_tag: "{{ _prev.frontend_tag }}"

        - name: Rollback — docker compose up z poprzednimi tagami
          ansible.builtin.command:
            cmd: >
              docker compose
              --env-file {{ deploy_dir }}/.env
              -f {{ deploy_dir }}/docker-compose.prod.yml
              up -d
          changed_when: true

        - name: Rollback — zakończ playbook błędem
          ansible.builtin.fail:
            msg: >
              Deploy NIEUDANY. Auto-rollback do backend={{ _prev.backend_tag }},
              frontend={{ _prev.frontend_tag }}.
              Sprawdź logi powyżej lub: docker logs {{ compose_project }}-backend-1 --tail 200
