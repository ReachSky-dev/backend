name: Deploy

# Wyzwalacz: tylko po udanym zakończeniu workflow Release na main.
# Nigdy na pull_request — sekrety produkcyjne nie trafiają do forków ani PR-ów.
on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
    branches: [main]

permissions:
  contents: read   # checkout
  actions:  read   # odczyt danych workflow_run

# Jeden aktywny deploy naraz — kolejne czekają, żaden nie jest anulowany w trakcie.
concurrency:
  group: deploy-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:

  # ────────────────────────────────────────────────────────────────────────────
  # Deploy demo — automatyczny, bez akceptacji
  # ────────────────────────────────────────────────────────────────────────────
  deploy-demo:
    name: Deploy — demo
    runs-on: [self-hosted, reachsky]
    if: github.event.workflow_run.conclusion == 'success'

    environment:
      name: demo
      url: https://demo.reachsky.pl

    steps:
      - name: Checkout (SHA z Release)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Przygotuj hasło Vaulta
        run: |
          echo "${{ secrets.VAULT_PASSWORD }}" > "$HOME/.vault_pass_reachsky"
          chmod 600 "$HOME/.vault_pass_reachsky"

      - name: Deploy demo
        working-directory: deploy/
        run: |
          ansible-playbook -i inventory.local.yml deploy.yml -l demo \
            -e "backend_tag=${{ github.event.workflow_run.head_sha }}" \
            -e "frontend_tag=${{ vars.FRONTEND_TAG }}"

      - name: Usuń hasło Vaulta
        if: always()
        run: rm -f "$HOME/.vault_pass_reachsky"

      - name: Job summary
        if: success()
        run: |
          echo "## Deploy — demo" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| | |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **SHA** | \`${{ github.event.workflow_run.head_sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **frontend** | \`${{ vars.FRONTEND_TAG }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **URL** | https://demo.reachsky.pl |" >> "$GITHUB_STEP_SUMMARY"

  # ────────────────────────────────────────────────────────────────────────────
  # Deploy prod — wymaga ręcznej akceptacji w GitHub Environment "production"
  # (Settings → Environments → production → Required reviewers)
  # Uruchamia się tylko po pomyślnym deploy na demo.
  # ────────────────────────────────────────────────────────────────────────────
  deploy-prod:
    name: Deploy — prod
    needs: deploy-demo
    runs-on: [self-hosted, reachsky]

    environment:
      name: production
      url: https://reachsky.pl

    steps:
      - name: Checkout (SHA z Release)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Przygotuj hasło Vaulta
        run: |
          echo "${{ secrets.VAULT_PASSWORD }}" > "$HOME/.vault_pass_reachsky"
          chmod 600 "$HOME/.vault_pass_reachsky"

      - name: Deploy prod
        working-directory: deploy/
        run: |
          ansible-playbook -i inventory.local.yml deploy.yml -l prod \
            -e "backend_tag=${{ github.event.workflow_run.head_sha }}" \
            -e "frontend_tag=${{ vars.FRONTEND_TAG }}"

      - name: Usuń hasło Vaulta
        if: always()
        run: rm -f "$HOME/.vault_pass_reachsky"

      - name: Job summary
        if: success()
        run: |
          echo "## Deploy — prod" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| | |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **SHA** | \`${{ github.event.workflow_run.head_sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **frontend** | \`${{ vars.FRONTEND_TAG }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **URL** | https://reachsky.pl |" >> "$GITHUB_STEP_SUMMARY"
