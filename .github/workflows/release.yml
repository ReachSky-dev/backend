name: Release

on:
  push:
    branches: [main]

jobs:
  docker:
    name: Build · Scan · Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Budujemy obraz lokalnie (push: false) — dopiero po przejściu skanu Trivy
      # trafia na Docker Hub. W ten sposób nigdy nie publikujemy obrazu z
      # podatnościami HIGH/CRITICAL.
      - name: Build image (local, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/backend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/backend:latest
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Scan with Trivy — gate HIGH and CRITICAL
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/backend:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push to Docker Hub
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/backend:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/backend:latest

      - name: Job summary
        run: |
          SIZE=$(docker image inspect \
            ${{ secrets.DOCKERHUB_USERNAME }}/backend:${{ github.sha }} \
            --format='{{.Size}}' | awk '{printf "%.0f MB", $1/1024/1024}')
          echo "## Docker image published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| | |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Rozmiar obrazu** | ${SIZE} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Tag SHA** | \`${{ secrets.DOCKERHUB_USERNAME }}/backend:${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Tag latest** | \`${{ secrets.DOCKERHUB_USERNAME }}/backend:latest\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | ${{ github.sha }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Autor** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
