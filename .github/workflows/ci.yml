name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and verify
        run: ./mvnw -B verify

      - name: Check docs/openapi.json is up to date
        run: |
          if ! git diff --exit-code docs/openapi.json; then
            echo "docs/openapi.json is stale — run ./mvnw verify locally and commit the result."
            exit 1
          fi

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports
